name: Enviar mails pendientes

# El plan gratuito de Vercel solo permite un cron por día (ver vercel.json), así que los mails
# se envían desde acá, cada 5 minutos. Necesita dos secretos del repositorio
# (Settings → Secrets and variables → Actions):
#   APP_URL      la dirección pública, p. ej. https://salus-green.vercel.app
#   CRON_SECRET  el mismo valor que CRON_SECRET en Vercel
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Llamar al endpoint de notificaciones
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltan los secretos APP_URL y CRON_SECRET en el repositorio."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "${APP_URL%/}/api/cron/notificaciones" \
            -H "Authorization: Bearer $CRON_SECRET"
